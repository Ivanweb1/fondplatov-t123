<!doctype html>
<html lang="ru">
<head>

  <style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden;background:#080a0c}iframe{display:block}</style>
</head>
<body>
  <iframe id="details-frame" src="../t123-project-postoim-details-v3.html" title="Синопсис проекта «Постоим за честь державы»"></iframe>
  <script>
    const detailsFrame = document.getElementById('details-frame');
    if (location.hash) detailsFrame.src += location.hash;
    window.addEventListener('hashchange', () => {
      if (detailsFrame.contentWindow) detailsFrame.contentWindow.location.hash = location.hash;
    });
  </script>
</body>
