<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Фонд имени М. И. Платова — вариант с видео</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090b0d;
    }

    iframe {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #090b0d;
    }
  </style>
</head>
<body>
  <iframe
    id="home-frame"
    src="../t123-video-background.html?v=20260826-3"
    title="Предпросмотр первых двух экранов сайта фонда с видеофоном"
    allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
  ></iframe>
  <script>
    const homeFrame = document.getElementById('home-frame');
    if (location.hash) homeFrame.src += location.hash;
    window.addEventListener('hashchange', () => {
      if (homeFrame.contentWindow) homeFrame.contentWindow.location.hash = location.hash;
    });
  </script>
</body>
</html>
