    iframe { position: fixed; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #080a0c; }

<body>
  <iframe id="igra-frame" src="../t123-project-igra.html?v=20260826" title="Страница проекта «Великая игра»" allow="payment *"></iframe>
  <script>
    const igraFrame = document.getElementById('igra-frame');
    if (location.hash) igraFrame.src += location.hash;
    window.addEventListener('hashchange', () => {
      if (igraFrame.contentWindow) igraFrame.contentWindow.location.hash = location.hash;
    });
  </script>
</body>
